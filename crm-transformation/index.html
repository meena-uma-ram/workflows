<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>CRM Transformation Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app. Header with workflow tabs, node canvas on the left, detail rail on the right (stacks below on phones). */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --ink: #18222d;
  --muted: #5b6875;
  --line: #d5dce2;
  --accent: #0d6b67;
  --accent-soft: #dcefed;
  --gate: #a8650b;
  --gate-soft: #fbf0dc;
  --post: #2f7d4f;
  --post-soft: #e2f2e8;
  --exit: #7c8792;
  --exit-soft: #eef1f3;
  --edge: #94a2ae;
  --grid: #e4e9ed;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171e; --surface: #18212a; --ink: #e6ecf1; --muted: #9aa8b5; --line: #2c3945;
    --accent: #4fc2bb; --accent-soft: #163a39; --gate: #e3a548; --gate-soft: #3a2c15;
    --post: #6cc28f; --post-soft: #17372a; --exit: #8d99a4; --exit-soft: #222c35;
    --edge: #5e6e7c; --grid: #1a242d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171e; --surface: #18212a; --ink: #e6ecf1; --muted: #9aa8b5; --line: #2c3945;
  --accent: #4fc2bb; --accent-soft: #163a39; --gate: #e3a548; --gate-soft: #3a2c15;
  --post: #6cc28f; --post-soft: #17372a; --exit: #8d99a4; --exit-soft: #222c35;
  --edge: #5e6e7c; --grid: #1a242d; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; }
.app { height: 100%; display: flex; flex-direction: column; }
header {
  padding-block: 14px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; gap: 10px;
}
.titlebar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: 1.45rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.86rem; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.tab {
  font: inherit; font-size: 0.84rem; background: none; border: 0; color: var(--muted); cursor: pointer;
  padding: 8px 12px 10px; border-bottom: 3px solid transparent; white-space: nowrap; display: flex; gap: 7px; align-items: center;
}
.tab .k { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.tab .pct { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab:focus-visible, button:focus-visible, input:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.stage { position: relative; min-width: 0; overflow: hidden; }
svg#canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
svg#canvas.dragging { cursor: grabbing; }
.toolbar {
  position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none;
}
.toolbar > * { pointer-events: auto; }
.search { flex: 1 1 180px; max-width: 280px; }
.search input {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 0.85rem; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink);
}
.btns { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.btns button { font: inherit; font-size: 0.82rem; border: 0; background: none; color: var(--ink); padding: 7px 10px; cursor: pointer; }
.btns button + button { border-left: 1px solid var(--line); }
.btns button:hover { background: var(--accent-soft); }
.legend {
  position: absolute; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; flex-wrap: wrap;
  font-size: 0.74rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 12px; height: 10px; border-radius: 2px; border: 1.5px solid; display: inline-block; }

aside {
  border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; min-width: 0;
  padding-block: 18px 24px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
aside h2 { font-family: var(--font-display); font-stretch: 85%; font-weight: 700; font-size: 1.25rem; line-height: 1.2; margin: 0; text-wrap: balance; }
aside p { margin: 0; line-height: 1.55; color: var(--ink); }
.muted { color: var(--muted); }
.owner { display: flex; gap: 8px; font-size: 0.85rem; line-height: 1.45; }
.owner b { font-weight: 600; }
.group-list { margin: 0; padding-left: 18px; line-height: 1.6; }
h3 { font-size: 0.72rem; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
.links { display: flex; flex-direction: column; gap: 4px; }
.link {
  text-align: left; font: inherit; font-size: 0.86rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 10px; color: var(--ink); cursor: pointer; display: flex; gap: 8px; align-items: baseline;
}
.link:hover { border-color: var(--accent); }
.link .via { font-family: var(--font-mono); font-size: 0.72rem; color: var(--gate); white-space: nowrap; }
.link .via.loop { color: var(--muted); }
.done-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); cursor: pointer; }
.done-row input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.walk { display: flex; gap: 8px; }
.walk button {
  flex: 1; font: inherit; font-size: 0.85rem; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.walk button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.walk button:disabled { opacity: 0.45; cursor: default; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.bar { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.pnum { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
kbd { font-family: var(--font-mono); font-size: 0.72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

/* SVG */
.edge path { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge.loop path { stroke-dasharray: 5 4; }
.edge text { font-family: var(--font-mono); font-size: 11px; fill: var(--gate); }
.edge .lbg { fill: var(--bg); }
.edge.loop text { fill: var(--muted); }
.edge.hot path { stroke: var(--accent); stroke-width: 2.4; }
.node { cursor: pointer; }
.node rect.ring { fill: none; stroke: none; }
.node rect.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.node text { font-family: var(--font-body); font-size: 13px; fill: var(--ink); }
.node text.ttl { font-weight: 600; }
.node text.det { font-size: 11.5px; fill: var(--muted); }
.node text.tag { font-family: var(--font-mono); font-size: 10px; fill: var(--muted); letter-spacing: .05em; }
.node.t-decision rect.box { fill: var(--gate-soft); stroke: var(--gate); stroke-dasharray: 5 3; }
.node.t-terminal rect.box { fill: var(--accent-soft); stroke: var(--accent); }
.node.t-datastore rect.box { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 3; }
.node.t-summary rect.box { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 3; }
.node.t-group rect.box { fill: var(--bg); stroke: var(--accent); }
.node.t-group text.gtitle { font-weight: 600; }
.node.k-exit rect.box { fill: var(--exit-soft); stroke: var(--exit); }
.node.k-post rect.box { fill: var(--post-soft); stroke: var(--post); }
.node:hover rect.box { stroke-width: 2.5; }
.node.sel rect.box { stroke: var(--accent); stroke-width: 3; }
.node.match rect.ring { stroke: var(--gate); stroke-width: 3; fill: none; }
.node .check { display: none; }
.node.done .check { display: block; }
.node.done text.ttl, .node.done text.gtitle { fill: var(--muted); }
.check circle { fill: var(--post); }
.check path { stroke: var(--surface); stroke-width: 2; fill: none; }
.dim { opacity: 0.22; transition: opacity .2s; }
.node, .edge { transition: opacity .2s; }
#noscript-msg { padding: 24px; }

@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(320px, 58%) auto; overflow-y: auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: visible; }
  .legend { display: none; }
  h1 { font-size: 1.2rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <div class="titlebar">
      <h1>Global CRM Transformation</h1>
      <span class="sub">8 countries · 8 months · HubSpot · people, process and governance</span>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <main>
    <div class="stage">
      <svg id="canvas" aria-label="Workflow node graph">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="var(--grid)"></circle></pattern>

        <g id="viewport"></g>

      <div class="toolbar">

        <div class="btns">
          <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="fit" title="Fit to screen">Fit</button>
        </div>
      </div>
      <div class="legend">
        <span><i class="sw" style="border-color:var(--line);background:var(--surface)"></i>Step</span>
        <span><i class="sw" style="border-color:var(--gate);background:var(--gate-soft);border-style:dashed"></i>Decision</span>
        <span><i class="sw" style="border-color:var(--post);background:var(--post-soft)"></i>Post-sale</span>
        <span><i class="sw" style="border-color:var(--exit);background:var(--exit-soft)"></i>Exit / hold</span>
        <span><i class="sw" style="border-color:var(--accent);background:var(--accent-soft)"></i>Start / end</span>
        <span>┈ loop back</span>
      </div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

 Design global workflow +", "detail": "country-specific adaptations"}, {"id": "E.P3", "type": "step", "label": "3. Integrate tools & configure HubSpot"}, {"id": "E.P4", "type": "step", "label": "4. Test workflows, data quality,", "detail": "reporting & handoffs"}, {"id": "E.P5", "type": "step", "label": "5. Train users & prepare local support"}, {"id": "E.GT", "type": "decision", "label": "Technical AND", "detail": "business ready?"}, {"id": "E.FIX", "type": "step", "label": "Close gaps"}, {"id": "E.P6", "type": "step", "label": "6. Joint sign-off", "detail": "RevOps + country leadership"}, {"id": "E.P7", "type": "step", "label": "7. Launch"}, {"id": "E.P8", "type": "step", "label": "8. Hypercare (2–4 weeks)"}, {"id": "E.ST", "type": "decision", "label": "System stable?"}, {"id": "E.P9", "type": "step", "label": "9. Transition to standard support"}, {"id": "E.P10", "type": "step", "label": "10. Evaluate performance"}, {"id": "E.MORE", "type": "decision", "label": "More countries", "detail": "remaining?"}, {"id": "E.DONE", "type": "terminal", "label": "All 8 countries live"}], "edges": [{"from": "E.S", "to": "E.P1"}, {"from": "E.P1", "to": "E.P2"}, {"from": "E.P2", "to": "E.P3"}, {"from": "E.P3", "to": "E.P4"}, {"from": "E.P4", "to": "E.P5"}, {"from": "E.P5", "to": "E.GT"}, {"from": "E.GT", "to": "E.FIX", "label": "No"}, {"from": "E.FIX", "to": "E.P4"}, {"from": "E.GT", "to": "E.P6", "label": "Yes"}, {"from": "E.P6", "to": "E.P7"}, {"from": "E.P7", "to": "E.P8"}, {"from": "E.P8", "to": "E.ST"}, {"from": "E.ST", "to": "E.P8", "label": "No"}, {"from": "E.ST", "to": "E.P9", "label": "Yes"}, {"from": "E.P9", "to": "E.P10"}, {"from": "E.P10", "to": "E.MORE"}, {"from": "E.MORE", "to": "E.S", "label": "Yes"}, {"from": "E.MORE", "to": "E.DONE", "label": "No"}]}, {"id": "F", "name": "Balanced scorecard", "nodes": [{"id": "F.AD", "type": "step", "label": "📊 Adoption", "detail": "Are employees using the intended workflows?"}, {"id": "F.DQ", "type": "step", "label": "📊 Data quality", "detail": "Can leadership trust the CRM and its reports?"}, {"id": "F.PE", "type": "step", "label": "📊 Process efficiency", "detail": "Are admin effort and delays decreasing?"}, {"id": "F.BO", "type": "step", "label": "📊 Business outcomes", "detail": "Conversion · pipeline health · sales cycle · revenue"}, {"id": "F.SC", "type": "summary", "label": "Global scorecard", "detail": "consolidated by RevOps"}], "edges": [{"from": "F.AD", "to": "F.SC"}, {"from": "F.DQ", "to": "F.SC"}, {"from": "F.PE", "to": "F.SC"}, {"from": "F.BO", "to": "F.SC"}]}, {"id": "G", "name": "Continuous improvement cadence", "nodes": [{"id": "G.W", "type": "step", "label": "Weekly country reviews", "detail": "identify operational problems, unblock teams"}, {"id": "G.M", "type": "step", "label": "Monthly global reviews", "detail": "compare trends, recurring issues, evaluate successful local practices"}, {"id": "G.Q", "type": "step", "label": "Quarterly executive reviews", "detail": "business impact, resources, readiness for expansion"}, {"id": "G.CHK", "type": "decision", "label": "Mandatory standard", "detail": "missed?"}, {"id": "G.CA", "type": "step", "label": "RevOps sets corrective actions", "detail": "and deadline"}, {"id": "G.EXE", "type": "step", "label": "Country leadership executes"}, {"id": "G.RE", "type": "decision", "label": "Resolved by deadline?"}, {"id": "G.ESC", "type": "step", "label": "Escalate to", "detail": "executive steering group"}], "edges": [{"from": "G.W", "to": "G.M"}, {"from": "G.M", "to": "G.Q"}, {"from": "G.Q", "to": "G.W", "label": "priorities", "style": "loop"}, {"from": "G.W", "to": "G.CHK"}, {"from": "G.CHK", "to": "G.CA", "label": "Yes"}, {"from": "G.CA", "to": "G.EXE"}, {"from": "G.EXE", "to": "G.RE"}, {"from": "G.RE", "to": "G.W", "label": "Yes"}, {"from": "G.RE", "to": "G.ESC", "label": "No (repeated failure)"}]}, {"id": "H", "name": "Guiding principles", "nodes": [{"id": "H.GS", "type": "step", "label": "Global standards"}, {"id": "H.CO", "type": "ste <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);

  const INTRO = {
    A: ['Principles 1, 5 and 6', 'One connected workflow from first lead to measured customer value. Each gate asks for evidence before a deal moves on, so customer information does not disappear between teams.'],
    B: ['Principle 2', 'Connect the tools salespeople already use instead of forcing them to abandon them. The goal is less administrative friction, not more CRM activity.'],
    C: ['Principle 3', 'One global system, not eight disconnected ones. RevOps sets the standard; countries adapt within agreed boundaries, and proven local practices can become global.'],
    D: ['Principle 4', 'Every proposed change has a driver, an approver, consulted stakeholders and informed teams. Changes are assessed, tested, documented, approved and released under control.'],
    E: ['Principle 7', 'Eight countries, one at a time. A country does not go live because configuration is finished: technical readiness and business readiness both have to be met.'],
    F: ['Principle 8', 'Four dimensions, consolidated by RevOps into one global scorecard.'],
    G: ['Principle 9', 'Weekly, monthly and quarterly reviews, plus a defined path when a country misses a mandatory standard.'],
    H: ['Principle 10', 'Governance as an enabler, not bureaucracy. The aim is an operating system for commercial growth, not a CRM employees are forced to maintain.']
  };
  const OWNER = {
    'A.A9': 'Sales hands over to Implementation and Customer Success',
    'A.A10': 'Implementation (deployment and training)',
    'A.A11': 'Customer Success (adoption and value realization); Sales supports the transition',
    'A.A12': 'Customer Success for post-sale outcomes; RevOps consolidates',
    'C.GLOBAL': 'Global Revenue Operations',
    'C.LOCAL': 'Country leadership',
    'C.EV': 'RevOps',
    'D.CCB': 'RevOps, Sales, Customer Success, Legal & Privacy, country leaders',
    'D.ESG': 'Executive steering group',
    'E.P6': 'RevOps and country leadership, jointly',
    'F.AD': 'RevOps', 'F.DQ': 'RevOps', 'F.PE': 'RevOps',
    'F.BO': 'Sales (sales outcomes) and Customer Success (post-sale outcomes)',
    'F.SC': 'RevOps',
    'G.CA': 'RevOps', 'G.EXE': 'Country leadership', 'G.ESC': 'Executive steering group'
  };
  const KIND = { 'A.X1': 'exit', 'A.X2': 'exit', 'A.X3': 'exit', 'C.KL': 'exit', 'D.RJ': 'exit',
    'A.A9': 'post', 'A.A10': 'post', 'A.A11': 'post', 'A.A12': 'post', 'G.ESC': 'exit', 'D.ESG': 'exit' };
  const TYPE_NAME = { step: 'Step', decision: 'Decision', terminal: 'Start / end', datastore: 'System', summary: 'Scorecard', group: 'Owner group' };

  // Collapse subgraphs into single group nodes listing their members.
  const flows = DATA.workflows.map(w => {
    const groupOf = {}, members = {};
    (w.groups || []).forEach(g => { members[g.id] = []; });
    const nodes = [];
    w.nodes.forEach(n => {
      const gid = (w.groups || []).find(g => g.label === n.group)?.id;
      if (gid) { groupOf[n.id] = gid; members[gid].push(n.detail ? n.label + ': ' + n.detail : n.label); } else nodes.push({ ...n });
    });
    (w.groups || []).forEach(g => nodes.push({ id: g.id, type: 'group', label: g.label, members: members[g.id] }));
    const seen = new Set(), edges = [];
    w.edges.forEach(e => {
      const from = groupOf[e.from] || e.from, to = groupOf[e.to] || e.to;
      const key = from + '>' + to + '>' + (e.label || '');
      if (from === to || seen.has(key)) return;
      seen.add(key); edges.push({ ...e, from, to });
    });
    return { id: w.id, name: w.name, nodes, edges };
  });

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let done = store.get('crm-map-done', {});

  const svg = document.getElementById('canvas'), vp = document.getElementById('viewport');
  const panel = document.getElementById('panel'), tabsEl = document.getElementById('tabs'), q = document.getElementById('q');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function wrap(text, max) {
    const words = text.split(' '), lines = []; let cur = '';
    words.forEach(w => { if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
    if (cur) lines.push(cur); return lines;
  }

  let cur = null, layout = null, order = [], selected = null, t = { x: 0, y: 0, k: 1 }, shown = null;

  function buildTabs() {
    tabsEl.innerHTML = '';
    flows.forEach(f => {
      const b = document.createElement('button');
      b.className = 'tab'; b.setAttribute('role', 'tab'); b.id = 'tab-' + f.id;
      b.setAttribute('aria-selected', String(cur && cur.id === f.id));
      const p = pct(f);
      b.innerHTML = `<span class="k">${f.id}</span>${esc(f.name)}${p ? `<span class="pct">${p}%</span>` : ''}`;
      b.onclick = () => show(f.id);
      tabsEl.appendChild(b);
    });
  }
  function pct(f) { const n = f.nodes.length, d = f.nodes.filter(x => done[x.id]).length; return n ? Math.round(d / n * 100) : 0; }

  function show(id, nodeId) {
    cur = flows.find(f => f.id === id) || flows[0];
    selected = null;
    try { history.replaceState(null, '', '#' + cur.id.toLowerCase()); } catch (e) {}
    store.set('crm-map-tab', cur.id);
    buildTabs();
    draw();
    fit(false);
    if (nodeId) select(nodeId, true); else renderPanel();
  }

  function draw() {
    vp.innerHTML = '';
    const g = new dagre.graphlib.Graph({ multigraph: true });
    const wide = cur.id === 'B' || cur.id === 'F' || cur.id === 'H';
    g.setGraph({ rankdir: wide ? 'LR' : 'TB', nodesep: 34, ranksep: wide ? 70 : 54, edgesep: 16, marginx: 30, marginy: 30 });
    g.setDefaultEdgeLabel(() => ({}));
    cur.nodes.forEach(n => {
      const W = n.type === 'group' ? 250 : 220;
      const lines = n.type === 'group' ? [] : wrap(n.label, 26);
      const dlines = n.type === 'group' || !n.detail ? [] : wrap(n.detail, 34);
      const mlines = n.type === 'group' ? n.members.flatMap(m => wrap('• ' + m, 32)) : [];
      const h = n.type === 'group' ? 44 + mlines.length * 18 + 10 : 30 + lines.length * 17 + (dlines.length ? 4 + dlines.length * 15 : 0) + 10;
      g.setNode(n.id, { width: W, height: h, data: n, lines, dlines, mlines });
    });
    cur.edges.forEach((e, i) => g.setEdge(e.from, e.to, { label: e.label || '', width: e.label ? e.label.length * 6.8 + 10 : 0, height: e.label ? 16 : 0, labelpos: 'c', data: e }, 'e' + i));
    dagre.layout(g);
    layout = g;

    const eg = el('g', {}, vp), ng = el('g', {}, vp);
    g.edges().forEach(k => {
      const e = g.edge(k), d = e.data;
      const grp = el('g', { class: 'edge' + (d.style === 'loop' ? ' loop' : ''), 'data-from': d.from, 'data-to': d.to }, eg);
      el('path', { d: smooth(e.points), 'marker-end': 'url(#arrow)' }, grp);
      if (e.label) {
        el('rect', { class: 'lbg', x: e.x - e.width / 2, y: e.y - 9, width: e.width, height: 18, rx: 3 }, grp);
        const tx = el('text', { x: e.x, y: e.y + 4, 'text-anchor': 'middle' }, grp); tx.textContent = e.label;
      }
    });
    g.nodes().forEach(id => {
      const n = g.node(id), d = n.data;
      const x = n.x - n.width / 2, y = n.y - n.height / 2;
      const cls = ['node', 't-' + d.type, KIND[id] ? 'k-' + KIND[id] : '', done[id] ? 'done' : ''].join(' ');
      const grp = el('g', { class: cls, transform: `translate(${x},${y})`, 'data-id': id, tabindex: 0, role: 'button', 'aria-label': d.label }, ng);
      const rx = d.type === 'terminal' ? n.height / 2 : d.type === 'datastore' ? 18 : 8;
      el('rect', { class: 'ring', x: -5, y: -5, width: n.width + 10, height: n.height + 10, rx: rx + 4 }, grp);
      el('rect', { class: 'box', width: n.width, height: n.height, rx }, grp);
      const tag = el('text', { class: 'tag', x: 14, y: 18 }, grp);
      tag.textContent = (TYPE_NAME[d.type] || 'Step').toUpperCase() + (KIND[id] === 'exit' ? ' · HOLD' : KIND[id] === 'post' ? ' · POST-SALE' : '');
      if (d.type === 'group') {
        const tt = el('text', { class: 'gtitle', x: 14, y: 36 }, grp); tt.textContent = d.label;
        n.mlines.forEach((l, i) => { const tx = el('text', { x: 14, y: 58 + i * 18 }, grp); tx.textContent = l; });
      } else {
        n.lines.forEach((l, i) => { const tx = el('text', { class: 'ttl', x: 14, y: 37 + i * 17 }, grp); tx.textContent = l; });
        const dy = 37 + n.lines.length * 17 + 2;
        n.dlines.forEach((l, i) => { const tx = el('text', { class: 'det', x: 14, y: dy + i * 15 }, grp); tx.textContent = l; });
      }
      const ck = el('g', { class: 'check', transform: `translate(${n.width - 16},14)` }, grp);
      el('circle', { r: 8 }, ck); el('path', { d: 'M-3.5 0 L-1 2.8 L4 -2.8' }, ck);
      grp.addEventListener('click', ev => { if (!moved) select(id); });
      grp.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(id); } });
    });
    // Walk order: by rank, main-path nodes before exits/holds within a rank.
    const lr = g.graph().rankdir === 'LR', side = id => KIND[id] === 'exit' ? 1 : 0;
    order = g.nodes().map(id => g.node(id)).sort((a, b) => lr
      ? (Math.round(a.x) - Math.round(b.x)) || (a.y - b.y)
      : (Math.round(a.y) - Math.round(b.y)) || (side(a.data.id) - side(b.data.id)) || (a.x - b.x)).map(n => n.data.id);
    applySearch();
  }

  function smooth(p) {
    if (p.length < 3) return 'M' + p.map(a => a.x + ' ' + a.y).join(' L');
    let d = `M${p[0].x} ${p[0].y}`;
    for (let i = 1; i < p.length - 1; i++) {
      const mx = (p[i].x + p[i + 1].x) / 2, my = (p[i].y + p[i + 1].y) / 2;
      d += ` Q${p[i].x} ${p[i].y} ${i === p.length - 2 ? p[i + 1].x : mx} ${i === p.length - 2 ? p[i + 1].y : my}`;
    }
    return d;
  }

  function nodeById(id) { return cur.nodes.find(n => n.id === id); }

  function select(id, center = true) {
    selected = id;
    const ins = cur.edges.filter(e => e.to === id), outs = cur.edges.filter(e => e.from === id);
    const near = new Set([id, ...ins.map(e => e.from), ...outs.map(e => e.to)]);
    vp.querySelectorAll('.node').forEach(n => { n.classList.toggle('sel', n.dataset.id === id); n.classList.toggle('dim', !near.has(n.dataset.id)); });
    vp.querySelectorAll('.edge').forEach(e => {
      const hot = e.dataset.from === id || e.dataset.to === id;
      e.classList.toggle('hot', hot); e.classList.toggle('dim', !hot);
      e.querySelector('path').setAttribute('marker-end', hot ? 'url(#arrow-hot)' : 'url(#arrow)');
    });
    if (center) centerOn(id);
    renderPanel();
  }
  function clearSel() {
    selected = null;
    vp.querySelectorAll('.node, .edge').forEach(n => n.classList.remove('sel', 'dim', 'hot'));
    vp.querySelectorAll('.edge path').forEach(p => p.setAttribute('marker-end', 'url(#arrow)'));
    renderPanel();
  }

  function renderPanel() {
    const [src, intro] = INTRO[cur.id];
    const n = cur.nodes.length, d = cur.nodes.filter(x => done[x.id]).length;
    const progress = `<div class="progress"><div class="pnum">${d} of ${n} nodes marked done</div><div class="bar"><i style="width:${n ? d / n * 100 : 0}%"></i></div></div>`;
    if (!selected) {
      panel.innerHTML = `
        <div class="eyebrow"><span>Workflow ${cur.id}</span><span>·</span><span>${src}</span></div>
        <h2>${esc(cur.name)}</h2>
        <p>${intro}</p>
        ${progress}
        <div class="walk"><button class="primary" id="start">Walk through from the start</button></div>
        <p class="hint">Click a node to see what feeds into it and what it leads to. Drag to pan, scroll or use <kbd>+</kbd> <kbd>−</kbd> to zoom. In a walk-through, <kbd>←</kbd> <kbd>→</kbd> step between nodes and <kbd>Esc</kbd> exits. Your done marks are saved in this browser only.</p>`;
      panel.querySelector('#start').onclick = () => select(order[0]);
      return;
    }
    const node = nodeById(selected), i = order.indexOf(selected);
    const ins = cur.edges.filter(e => e.to === selected), outs = cur.edges.filter(e => e.from === selected);
    const link = (e, other) => `<button class="link" data-go="${other}">${e.label ? `<span class="via${e.style === 'loop' ? ' loop' : ''}">${esc(e.label)}</span>` : e.style === 'loop' ? '<span class="via loop">loop</span>' : ''}<span>${esc(nodeById(other).label)}</span></button>`;
    const kindColor = node.type === 'decision' ? 'var(--gate)' : KIND[selected] === 'post' ? 'var(--post)' : KIND[selected] === 'exit' ? 'var(--exit)' : 'var(--accent)';
    panel.innerHTML = `
      <div class="eyebrow"><span>${cur.id} · ${esc(cur.name)}</span><span class="chip" style="color:${kindColor}">${TYPE_NAME[node.type] || 'Step'}</span><span class="pnum">${i + 1}/${order.length}</span></div>
      <h2>${esc(node.label)}</h2>
      ${node.detail ? `<p>${esc(node.detail)}</p>` : ''}
      ${node.members ? `<ul class="group-list">${node.members.map(m => `<li>${esc(m)}</li>`).join('')}</ul>` : ''}
      ${OWNER[selected] ? `<div class="owner"><span class="muted">Owner</span><b>${esc(OWNER[selected])}</b></div>` : ''}
      ${node.type === 'decision' ? `<p class="muted">Gate: the work only continues along the branch that the evidence supports.</p>` : ''}
      <label class="done-row" for="done-box"><input type="checkbox" id="done-box" ${done[selected] ? 'checked' : ''}><span>Mark as done</span></label>
      ${ins.length ? `<div><h3>Comes from</h3><div class="links">${ins.map(e => link(e, e.from)).join('')}</div></div>` : ''}
      ${outs.length ? `<div><h3>Leads to</h3><div class="links">${outs.map(e => link(e, e.to)).join('')}</div></div>` : ''}
      <div class="walk"><button id="prev" ${i <= 0 ? 'disabled' : ''}>← Previous</button><button class="primary" id="next" ${i >= order.length - 1 ? 'disabled' : ''}>Next →</button></div>
      <div class="walk"><button id="overview">Back to overview</button></div>
      ${progress}`;
    panel.querySelectorAll('[data-go]').forEach(b => b.onclick = () => select(b.dataset.go));
    panel.querySelector('#prev').onclick = () => step(-1);
    panel.querySelector('#next').onclick = () => step(1);
    panel.querySelector('#overview').onclick = () => { clearSel(); fit(true); };
    panel.querySelector('#done-box').onchange = ev => {
      if (ev.target.checked) done[selected] = true; else delete done[selected];
      store.set('crm-map-done', done);
      vp.querySelector(`.node[data-id="${selected}"]`).classList.toggle('done', ev.target.checked);
      buildTabs(); renderPanel();
    };
  }
  function step(dir) { const i = order.indexOf(selected); const j = i + dir; if (j >= 0 && j < order.length) select(order[j]); }

  // Pan & zoom
  let raf = 0;
  function apply(anim) {
    cancelAnimationFrame(raf);
    const set = v => vp.setAttribute('transform', `translate(${v.x},${v.y}) scale(${v.k})`);
    if (!anim || matchMedia('(prefers-reduced-motion: reduce)').matches || !shown) { shown = { ...t }; set(t); return; }
    const from = { ...shown }, to = { ...t }, t0 = performance.now();
    const tick = now => {
      const u = Math.min(1, (now - t0) / 350), e = 1 - Math.pow(1 - u, 3);
      shown = { x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e, k: from.k + (to.k - from.k) * e };
      set(shown); if (u < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  function fit(anim) {
    const gr = layout.graph(), r = svg.getBoundingClientRect();
    const top = 60, pad = 20;
    const kw = (r.width - pad * 2) / gr.width, kh = (r.height - top - pad) / gr.height;
    // Tall flows stay readable: fit the width (at least 0.7) and start at the top; drag to see the rest.
    t.k = Math.min(1.15, Math.max(Math.min(kw, kh), Math.min(kw, 0.7)), kw);
    t.x = (r.width - gr.width * t.k) / 2;
    t.y = top + Math.max(0, (r.height - top - pad - gr.height * t.k) / 2);
    apply(anim);
  }
  function centerOn(id) {
    const n = layout.node(id), r = svg.getBoundingClientRect();
    t.k = Math.max(t.k, 0.85);
    t.x = r.width / 2 - n.x * t.k; t.y = (r.height + 40) / 2 - n.y * t.k;
    apply(true);
  }
  function zoom(f, cx, cy) {
    const r = svg.getBoundingClientRect(); cx = cx ?? r.width / 2; cy = cy ?? r.height / 2;
    const k = Math.min(2.5, Math.max(0.2, t.k * f)); t.x = cx - (cx - t.x) * k / t.k; t.y = cy - (cy - t.y) * k / t.k; t.k = k; apply(false);
  }
  let drag = null, moved = false;
  const pointers = new Map();
  svg.addEventListener('pointerdown', e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false; drag = { x: e.clientX, y: e.clientY, tx: t.x, ty: t.y };
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; drag.pinch = Math.hypot(a.x - b.x, a.y - b.y); drag.k = t.k; }
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2 && drag.pinch) {
      const [a, b] = [...pointers.values()], r = svg.getBoundingClientRect();
      zoom(drag.k * Math.hypot(a.x - b.x, a.y - b.y) / drag.pinch / t.k, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); moved = true; return;
    }
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) > 4) { moved = true; svg.classList.add('dragging'); try { svg.setPointerCapture(e.pointerId); } catch (_) {} }
    if (moved) { t.x = drag.tx + dx; t.y = drag.ty + dy; apply(false); }
  });
  const end = e => { pointers.delete(e.pointerId); if (pointers.size === 0) { drag = null; svg.classList.remove('dragging'); setTimeout(() => { moved = false; }, 0); } };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  svg.addEventListener('click', e => { if (!moved && e.target.closest('.node') == null && selected) clearSel(); });
  svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoom(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  document.getElementById('zin').onclick = () => zoom(1.25);
  document.getElementById('zout').onclick = () => zoom(0.8);
  document.getElementById('fit').onclick = () => fit(true);
  window.addEventListener('resize', () => { if (!selected) fit(false); });
  document.addEventListener('keydown', e => {
    if (e.target === q) { if (e.key === 'Escape') { q.value = ''; applySearch(); q.blur(); } return; }
    if (e.key === 'ArrowRight' && selected) { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft' && selected) { e.preventDefault(); step(-1); }
    else if (e.key === 'Escape' && selected) { clearSel(); fit(true); }
    else if (e.key === '+' || e.key === '=') zoom(1.25);
    else if (e.key === '-') zoom(0.8);
  });

  // Search: highlight matches in this workflow, jump to another workflow if it has the only match.
  function applySearch() {
    const s = q.value.trim().toLowerCase();
    vp.querySelectorAll('.node').forEach(n => {
      const d = nodeById(n.dataset.id), text = (d.label + ' ' + (d.detail || '') + ' ' + (d.members || []).join(' ') + ' ' + (OWNER[d.id] || '')).toLowerCase();
      n.classList.toggle('match', !!s && text.includes(s));
    });
  }
  q.addEventListener('input', applySearch);
  q.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const s = q.value.trim().toLowerCase(); if (!s) return;
    const hit = n => (n.label + ' ' + (n.detail || '') + ' ' + (n.members || []).join(' ') + ' ' + (OWNER[n.id] || '')).toLowerCase().includes(s);
    const here = order.filter(id => hit(nodeById(id)));
    if (here.length) { const i = here.indexOf(selected); select(here[(i + 1) % here.length]); return; }
    for (const f of flows) { const n = f.nodes.find(hit); if (n) { show(f.id, n.id); applySearch(); return; } }
  });

  const fromHash = (location.hash || '').slice(1).toUpperCase();
  show(flows.some(f => f.id === fromHash) ? fromHash : store.get('crm-map-tab', 'A'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!selected) fit(false); });
})();
</script>

</body>
</html>
